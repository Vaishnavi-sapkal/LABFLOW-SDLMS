services:
  auth-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/services/auth-service
    environment:
      PORT: 3000
      MONGODB_URI: mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_CLUSTER}/labflow-auth?retryWrites=true&w=majority
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-replace-with-a-long-random-secret}
      JWT_EXPIRES_IN: 1d
      DOCTOR_SERVICE_URL: http://doctor-service:3000
      PATIENT_SERVICE_URL: http://patient-service:3000
    depends_on: [doctor-service, patient-service]

  patient-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/services/patient-service
    environment:
      PORT: 3000
      MONGODB_URI: mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_CLUSTER}/labflow-patient?retryWrites=true&w=majority
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-replace-with-a-long-random-secret}
      BOOKING_SERVICE_URL: http://booking-service:3000
      REPORT_SERVICE_URL: http://report-service:3000
      BILLING_SERVICE_URL: http://billing-service:3000

  test-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/services/test-service
    environment:
      PORT: 3000
      MONGODB_URI: mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_CLUSTER}/labflow-test?retryWrites=true&w=majority
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-replace-with-a-long-random-secret}

  booking-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/services/booking-service
    environment:
      PORT: 3000
      MONGODB_URI: mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_CLUSTER}/labflow-booking?retryWrites=true&w=majority
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-replace-with-a-long-random-secret}
      TEST_SERVICE_URL: http://test-service:3000
      DOCTOR_SERVICE_URL: http://doctor-service:3000
    depends_on: [test-service, doctor-service]

  doctor-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/services/doctor-service
    environment:
      PORT: 3000
      MONGODB_URI: mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_CLUSTER}/labflow-doctor?retryWrites=true&w=majority
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-replace-with-a-long-random-secret}

  sample-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/services/sample-service
    environment:
      PORT: 3000
      MONGODB_URI: mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_CLUSTER}/labflow-sample?retryWrites=true&w=majority
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-replace-with-a-long-random-secret}
      BOOKING_SERVICE_URL: http://booking-service:3000
    depends_on: [booking-service]

  result-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/services/result-service
    environment:
      PORT: 3000
      MONGODB_URI: mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_CLUSTER}/labflow-result?retryWrites=true&w=majority
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-replace-with-a-long-random-secret}
      TEST_SERVICE_URL: http://test-service:3000
    depends_on: [test-service]

  verification-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/services/verification-service
    environment:
      PORT: 3000
      MONGODB_URI: mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_CLUSTER}/labflow-verification?retryWrites=true&w=majority
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-replace-with-a-long-random-secret}
      RESULT_SERVICE_URL: http://result-service:3000
      SAMPLE_SERVICE_URL: http://sample-service:3000
      DOCTOR_SERVICE_URL: http://doctor-service:3000
      REPORT_SERVICE_URL: http://report-service:3000
      PATIENT_SERVICE_URL: http://patient-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
    depends_on: [result-service, sample-service, doctor-service, patient-service, notification-service]

  billing-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/services/billing-service
    environment:
      PORT: 3000
      MONGODB_URI: mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_CLUSTER}/labflow-billing?retryWrites=true&w=majority
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-replace-with-a-long-random-secret}
      BOOKING_SERVICE_URL: http://booking-service:3000
      PATIENT_SERVICE_URL: http://patient-service:3000
      DOCTOR_SERVICE_URL: http://doctor-service:3000
      UPI_ID: ${UPI_ID}
    depends_on: [booking-service, patient-service, doctor-service]
  notification-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/services/notification-service
    environment:
      PORT: 3000
      MONGODB_URI: mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_CLUSTER}/labflow-notification?retryWrites=true&w=majority
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-replace-with-a-long-random-secret}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_SECURE: ${SMTP_SECURE:-false}

  report-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/services/report-service
    environment:
      PORT: 3000
      MONGODB_URI: mongodb+srv://${ATLAS_USER}:${ATLAS_PASSWORD}@${ATLAS_CLUSTER}/labflow-report?retryWrites=true&w=majority
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-replace-with-a-long-random-secret}
      VERIFICATION_SERVICE_URL: http://verification-service:3000
      RESULT_SERVICE_URL: http://result-service:3000
      SAMPLE_SERVICE_URL: http://sample-service:3000
      PATIENT_SERVICE_URL: http://patient-service:3000
      DOCTOR_SERVICE_URL: http://doctor-service:3000
    depends_on:
      [
        verification-service,
        result-service,
        sample-service,
        patient-service,
        doctor-service,
      ]

  dashboard-service:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/services/dashboard-service
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-replace-with-a-long-random-secret}
      PATIENT_SERVICE_URL: http://patient-service:3000
      BOOKING_SERVICE_URL: http://booking-service:3000
      TEST_SERVICE_URL: http://test-service:3000
      BILLING_SERVICE_URL: http://billing-service:3000
      SAMPLE_SERVICE_URL: http://sample-service:3000
      RESULT_SERVICE_URL: http://result-service:3000
      VERIFICATION_SERVICE_URL: http://verification-service:3000
      REPORT_SERVICE_URL: http://report-service:3000
    depends_on:
      [
        patient-service,
        booking-service,
        test-service,
        billing-service,
        sample-service,
        result-service,
        verification-service,
        report-service,
      ]

  api-gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PATH: backend/api-gateway
    environment:
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3000
      PATIENT_SERVICE_URL: http://patient-service:3000
      TEST_SERVICE_URL: http://test-service:3000
      BOOKING_SERVICE_URL: http://booking-service:3000
      DOCTOR_SERVICE_URL: http://doctor-service:3000
      SAMPLE_SERVICE_URL: http://sample-service:3000
      RESULT_SERVICE_URL: http://result-service:3000
      VERIFICATION_SERVICE_URL: http://verification-service:3000
      BILLING_SERVICE_URL: http://billing-service:3000
      NOTIFICATION_SERVICE_URL: http://notification-service:3000
      REPORT_SERVICE_URL: http://report-service:3000
      DASHBOARD_SERVICE_URL: http://dashboard-service:3000
    ports:
      - "3000:3000"
    depends_on:
      [
        auth-service,
        patient-service,
        test-service,
        booking-service,
        doctor-service,
        sample-service,
        result-service,
        verification-service,
        billing-service,
        notification-service,
        report-service,
        dashboard-service,
      ]
