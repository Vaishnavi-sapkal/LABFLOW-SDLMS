[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface


; ---------------------------------------------------------------------------
; LabFlow single-container process map
;
; Public gateway:
;   Render -> $PORT
;   Local/default -> 10000
;
; Internal services:
;   Auth          -> 3001
;   Patient       -> 3002
;   Doctor        -> 3003
;   Test          -> 3004
;   Booking       -> 3005
;   Sample        -> 3006
;   Result        -> 3007
;   Verification  -> 3008
;   Billing       -> 3009
;   Notification  -> 3010
;   Report        -> 3011
;   Dashboard     -> 3012
;
; All internal communication uses 127.0.0.1 because all services
; run inside the same Docker container.
; ---------------------------------------------------------------------------


[program:auth]
command=node /app/backend/services/auth-service/dist/main.js
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
environment=PORT="3001",MONGODB_URI="%(ENV_AUTH_MONGODB_URI)s",JWT_SECRET="%(ENV_JWT_SECRET)s",INTERNAL_SERVICE_SECRET="%(ENV_INTERNAL_SERVICE_SECRET)s",PATIENT_SERVICE_URL="http://127.0.0.1:3002",DOCTOR_SERVICE_URL="http://127.0.0.1:3003",NOTIFICATION_SERVICE_URL="http://127.0.0.1:3010",FRONTEND_URL="%(ENV_FRONTEND_URL)s"
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0


