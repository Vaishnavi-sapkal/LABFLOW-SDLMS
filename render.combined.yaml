services:
  - type: web
    name: labflow-combined
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile.combined
    dockerContext: .
    healthCheckPath: /ready
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_SECURE
        value: "false"
      - key: UPI_ID
        sync: false
      - key: UPI_PAYEE_NAME
        value: LabFlow Diagnostics
